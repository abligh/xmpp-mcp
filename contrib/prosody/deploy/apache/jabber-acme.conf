# Let's Encrypt HTTP-01 challenges for the XMPP server's certificates.
#
# Let's Encrypt fetches http://<name>/.well-known/acme-challenge/<token>;
# certbot answers it inside the Prosody container, published on
# 127.0.0.1:8480 (ACME_PORT in .env). Nothing else is served on these names:
# they are XMPP domains, not websites, so there is no port-443 counterpart.
#
# Install on the host:
#   sudo cp jabber-acme.conf /etc/apache2/sites-available/
#   sudo a2enmod proxy proxy_http
#   sudo a2ensite jabber-acme
#   sudo apachectl configtest && sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName jabber.example.com
    ServerAlias jabber-agent.example.com

    ProxyPass        /.well-known/acme-challenge/ http://127.0.0.1:8480/.well-known/acme-challenge/
    ProxyPassReverse /.well-known/acme-challenge/ http://127.0.0.1:8480/.well-known/acme-challenge/
    ProxyPreserveHost On

    <Location />
        Require all denied
    </Location>
    <Location /.well-known/acme-challenge/>
        Require all granted
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/jabber-acme-error.log
    CustomLog ${APACHE_LOG_DIR}/jabber-acme-access.log combined
</VirtualHost>
