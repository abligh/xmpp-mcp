# Prosody lab — humans on xmpp.test, agents on agents.xmpp.test with
# host-scoped derived credentials, TLS required. Listens on 127.0.0.1:5322 so
# it can run alongside the Openfire or ejabberd lab (both use 5222).
#
# Bring up (creates the CA, certificate and keys on first run):
#   python start-lab-prosody.py
# Tear down:
#   docker compose -f tests/integration/docker/prosody/docker-compose.yml down -v

name: xmpp-mcp-prosody

services:
  prosody:
    image: prosodyim/prosody:13.0
    container_name: xmpp-mcp-prosody-1
    hostname: xmpp.test
    ports:
      - "127.0.0.1:5322:5222"   # XMPP C2S (STARTTLS, required)
    volumes:
      - ./prosody.cfg.lua:/etc/prosody/prosody.cfg.lua:ro
      # The auth module is deployment material, not lab code (contrib/prosody/).
      - ../../../../contrib/prosody:/etc/prosody/modules:ro
      # Generated by start-lab-prosody.py; gitignored.
      - ./generated/certs:/etc/prosody/certs:ro
      - ./generated/secrets:/etc/prosody/secrets:ro
      - prosody-data:/var/lib/prosody
    healthcheck:
      test: ["CMD-SHELL", "prosodyctl shell 'server:version()' >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  prosody-data:
